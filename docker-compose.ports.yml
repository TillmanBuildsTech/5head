# Opt-in host port for a local or direct smoke test.
# Not named docker-compose.override.yml, so `docker compose up` and Coolify
# do not load it. Coolify imports docker-compose.yml alone.
#
#   FIVEHEAD_HOST_PORT=18080 docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d
#
# FIVEHEAD_HOST_PORT has no default. Compose exits if it is unset or empty.

services:
  api:
    ports:
      - "${FIVEHEAD_HOST_PORT:?set FIVEHEAD_HOST_PORT}:8080"
