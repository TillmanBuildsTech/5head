name: Snapshot build (CI)

# SNAPSHOT build: runs when a branch opens a PR against main. Builds + tests
# the code, produces Native AOT binaries, and publishes them as a rolling
# `snapshot` PRE-RELEASE so anyone can grab and try the latest PR build without
# waiting for a production release.
#
# Production release happens on merge to main — see release.yml.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results

  aot-build:
    name: Native AOT (${{ matrix.os }} / ${{ matrix.rid }})
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Native AOT
        run: >
          dotnet publish src/FiveHead.Mcp.Host/FiveHead.Mcp.Host.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishAot=true
          -o ./publish/${{ matrix.rid }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: 5head-mcp-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/

  # Verify stdout-silence (critical gate: stdout must only emit valid JSON-RPC)
  stdout-silence:
    name: stdout-silence gate
    needs: aot-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 5head-mcp-linux-x64
          path: ./bin/
      - name: Make executable
        run: chmod +x ./bin/5head-mcp
      # TODO: pipe a well-formed initialize request and assert no non-JSON-RPC bytes on stdout
      - name: Placeholder stdout-silence check
        run: echo "TODO implement stdout-silence integration test"

  # Publish the PR's binaries as a rolling `snapshot` PRE-RELEASE.
  # Pre-releases are excluded from `releases/latest`, so the production
  # one-line installer keeps pointing at stable builds; the snapshot is
  # installed explicitly via the `snapshot` tag (see README).
  snapshot-release:
    name: Publish snapshot pre-release
    needs: aot-build
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'chore/release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./snapshot-assets

      - name: Rename binaries to canonical asset names
        shell: bash
        run: |
          cd snapshot-assets
          for d in */; do
            rid="${d%/}"                       # artifact dir name == rid
            if [[ ! -e "$rid/5head-mcp" && ! -e "$rid/5head-mcp.exe" ]]; then
              echo "skip $rid (no binary)"
              continue
            fi
            if [[ -f "$rid/5head-mcp.exe" ]]; then
              mv "$rid/5head-mcp.exe" "$rid/5head-mcp-$rid.exe"
            else
              mv "$rid/5head-mcp" "$rid/5head-mcp-$rid"
            fi
          done
          ls -R

      - name: Publish rolling snapshot pre-release
        run: |
          # Rebuild the `snapshot` pre-release from this PR's binaries. The tag
          # moves with each new PR build (last one wins for a rolling snapshot).
          gh release delete snapshot --yes --cleanup-tag 2>/dev/null || true
          gh release create snapshot \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "5head-mcp snapshot (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Latest snapshot build from PR ${PR_NUMBER} (${HEAD_REF}). Not for production use — install with the snapshot tag:

            \`\`\`
            export FIVEHEAD_MCP_RELEASE_TAG=snapshot
            curl -sL https://github.com/${GITHUB_REPOSITORY}/releases/download/snapshot/install.js | node
            \`\`\`" \
            ./snapshot-assets/*/5head-mcp-* \
            ./scripts/install.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
