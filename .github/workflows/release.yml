name: Release

# Production release on merge to main.
#
#   - A PR opening against main runs ci.yml (the SNAPSHOT build): build + test +
#     Native AOT, then publishes those binaries as the rolling `snapshot` pre-release.
#   - Merging to main triggers THIS workflow. It rebuilds the exact release
#     binaries at the current <Version>, publishes them as a stable GitHub
#     Release (v<version>) with install.js and the platform binaries, then bumps
#     the version (patch by default; `[release:minor]` or `[release:major]` in
#     the merge message bumps that part) and opens a PR that carries the bump
#     back to main.
#
# The bump PR does NOT publish a GitHub Release. An empty stable release becomes
# `releases/latest` (GitHub's latest is the newest non-prerelease), which makes
# `releases/latest/download/install.js` 404. The bump commit message
# (`chore(release): bump`) is what stops that merge from cutting another release.
#
# Install is registry-free: `curl -sL .../releases/latest/download/install.js | node`

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_NOLOGO: "true"

jobs:
  release-meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.bump.outputs.bump }}
      skip: ${{ steps.guard.outputs.skip }}
      already_released: ${{ steps.guard.outputs.already_released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Current version (from Host csproj)
        id: version
        run: echo "version=$(grep -oP '(?<=<Version>)[0-9.]+(?=</Version>)' src/FiveHead.Mcp.Host/FiveHead.Mcp.Host.csproj | head -1)" >> "$GITHUB_OUTPUT"

      - name: Bump type from merge commit message
        id: bump
        run: |
          MSG=$(git log -1 --format=%B)
          if echo "$MSG" | grep -qi '\[release:major\]'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qi '\[release:minor\]'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip bump commits and already-published versions
        id: guard
        run: |
          MSG=$(git log -1 --format=%B)
          if echo "$MSG" | grep -Eqi 'chore\(release\): bump|\[skip-release\]'; then
            echo "Version-bump commit — not a release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "v${{ steps.version.outputs.version }} tag already exists — will not republish it."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.rid }})
    needs: release-meta
    if: needs.release-meta.outputs.skip != 'true' && needs.release-meta.outputs.already_released != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Native AOT
        run: >
          dotnet publish src/FiveHead.Mcp.Host/FiveHead.Mcp.Host.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishAot=true
          /p:Version=${{ needs.release-meta.outputs.version }}
          -o ./publish/${{ matrix.rid }}

      - name: Rename binary to release asset name
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv 5head-mcp.exe 5head-mcp-${{ matrix.rid }}.exe
          else
            mv 5head-mcp 5head-mcp-${{ matrix.rid }}
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: 5head-mcp-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/5head-mcp-*
          if-no-files-found: error

  release:
    name: Publish release + bump version
    needs: [release-meta, build]
    if: >-
      always() &&
      needs.release-meta.result == 'success' &&
      needs.release-meta.outputs.skip != 'true' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.release-meta.outputs.already_released == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release binaries
        if: needs.release-meta.outputs.already_released != 'true'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release v${{ needs.release-meta.outputs.version }}
        if: needs.release-meta.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write the (untrusted) merge-commit message to a file and use
          # --notes-file so it never lands on the command line.
          git log -1 --format=%B > RELEASE_NOTES.md
          gh release create "v${{ needs.release-meta.outputs.version }}" \
            --title "5head-mcp v${{ needs.release-meta.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            ./artifacts/*/5head-mcp-* \
            ./scripts/install.js

      - name: Bump version and open a release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/version.js "${{ needs.release-meta.outputs.bump }}"
          NEXT=$(grep -oP '(?<=<Version>)[0-9.]+(?=</Version>)' src/FiveHead.Mcp.Host/FiveHead.Mcp.Host.csproj | head -1)
          BRANCH="chore/release-v${NEXT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/FiveHead.Mcp.Host/FiveHead.Mcp.Host.csproj \
                  src/FiveHead.Mcp.Core/FiveHead.Mcp.Core.csproj
          git commit -m "chore(release): bump to v${NEXT} [skip-release]"
          # The bump branch may already exist from a previous attempt (the
          # v0.1.1 run pushed the branch, then failed to open the PR). Replace
          # it with this bump, which is based on the commit we just released.
          if git fetch origin "$BRANCH"; then
            git push --force-with-lease="refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" origin "HEAD:refs/heads/${BRANCH}"
          else
            git push -u origin "HEAD:refs/heads/${BRANCH}"
          fi
          # No empty release for v${NEXT}. `releases/latest` must keep pointing
          # at the release that actually has install.js and the binaries.
          # Merging the bump PR is skipped because its message matches
          # `chore(release): bump`.
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Bump PR #${EXISTING} is already open."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): bump to v${NEXT}" \
              --body "Release v${{ needs.release-meta.outputs.version }} published with binaries and install.js. This PR only bumps the in-repo version to v${NEXT}. Merging it does not publish a release (\`chore(release): bump\` / \`[skip-release]\`)." \
              --repo "${{ github.repository }}"
          fi
