# Home-lab stack. From this directory: cp .env.example .env, set STATE_AUTH_TOKEN,
# then docker compose up --build. The build context is the repo root so the
# Dockerfile can copy src/FiveHead.State.Api.
# Postgres is not published as the thing agents talk to; only the API should sit
# behind a Cloudflare Tunnel.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-state}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-state}
      POSTGRES_DB: ${POSTGRES_DB:-state}
    volumes:
      - state-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-state} -d ${POSTGRES_DB:-state}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      STATE_DATABASE_URL: postgres://${POSTGRES_USER:-state}:${POSTGRES_PASSWORD:-state}@postgres:5432/${POSTGRES_DB:-state}
      STATE_AUTH_TOKEN: ${STATE_AUTH_TOKEN:?set STATE_AUTH_TOKEN in deploy/.env}
      STATE_CLAIM_TTL_SECONDS: ${STATE_CLAIM_TTL_SECONDS:-300}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  state-pg:
